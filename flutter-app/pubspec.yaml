name: heyearth_vpn
description: HeYearth — персональный доступ по одному ID на всех устройствах.
publish_to: none
version: 1.0.10+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  app_links: ^7.0.0
  grpc: ^5.1.0
  protobuf: ^6.0.0
  uuid: ^4.5.1
  provider: ^6.1.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  proxy_manager: ^0.0.3
  flutter_v2ray_plus:
    path: packages/flutter_v2ray_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/app_icon.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#2d2d2d"
    theme_color: "#2d2d2d"
  windows:
    generate: true
    image_path: assets/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app_icon.png
  linux:
    generate: true
    image_path: assets/app_icon.png
