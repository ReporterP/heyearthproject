---
# Docker-based deployment for VPN nodes
# Include this instead of main.yml when deploy_mode == 'docker'

- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - jq
    state: present
    update_cache: yes

- name: Add Docker GPG key
  shell: curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: true

- name: Create runtime directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/heyearth
    - /opt/heyearth/certs
    - /opt/heyearth/state
    - /opt/heyearth/xray
    - /opt/heyearth/docker
    - /etc/shadowsocks-libev/users

- name: Upload CA certificate
  copy:
    src: "{{ node_agent_ca_cert_src | default('/opt/heyearth/mainserver/certs/ca-cert.pem') }}"
    dest: /opt/heyearth/certs/ca-cert.pem
    mode: "0644"

- name: Upload server certificate
  copy:
    src: "{{ node_agent_server_cert_src | default('/opt/heyearth/mainserver/certs/server-cert.pem') }}"
    dest: /opt/heyearth/certs/server-cert.pem
    mode: "0644"

- name: Upload server private key
  copy:
    src: "{{ node_agent_server_key_src | default('/opt/heyearth/mainserver/certs/server-key.pem') }}"
    dest: /opt/heyearth/certs/server-key.pem
    mode: "0600"

- name: Upload docker-compose.yml
  copy:
    src: "{{ docker_compose_src | default('../../docker/vpn-node/docker-compose.yml') }}"
    dest: /opt/heyearth/docker/docker-compose.yml
    mode: "0644"

- name: Upload .env for Docker
  template:
    src: docker-env.j2
    dest: /opt/heyearth/docker/.env
    mode: "0644"

- name: Allow node-agent gRPC port in UFW
  command: ufw allow {{ node_agent_port | default('50052') }}/tcp
  register: ufw_node_agent_result
  changed_when: "'Rule added' in ufw_node_agent_result.stdout"

- name: Allow Xray Reality port in UFW
  command: ufw allow {{ xray_reality_port | default('443') }}/tcp
  register: ufw_xray_result
  changed_when: "'Rule added' in ufw_xray_result.stdout"

- name: Build and start Docker stack
  shell: docker compose up -d --build
  args:
    chdir: /opt/heyearth/docker
