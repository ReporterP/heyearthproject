---
- name: Install required packages
  apt:
    name:
      - shadowsocks-libev
      - curl
      - jq
    state: present
    update_cache: yes

- name: Allow node-agent gRPC port in UFW
  command: ufw allow {{ node_agent_port | default('50052') }}/tcp
  register: ufw_node_agent_result
  changed_when: "'Rule added' in ufw_node_agent_result.stdout"

- name: Create runtime directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/heyearth
    - /opt/heyearth/certs
    - /opt/heyearth/state
    - /etc/shadowsocks-libev/users

- name: Upload node-agent binary
  copy:
    src: "{{ node_agent_binary_src | default('/opt/heyearth/mainserver/artifacts/node-agent') }}"
    dest: /opt/heyearth/node-agent
    mode: "0755"

- name: Upload CA certificate
  copy:
    src: "{{ node_agent_ca_cert_src | default('/opt/heyearth/mainserver/certs/ca-cert.pem') }}"
    dest: /opt/heyearth/certs/ca-cert.pem
    mode: "0644"

- name: Upload server certificate
  copy:
    src: "{{ node_agent_server_cert_src | default('/opt/heyearth/mainserver/certs/server-cert.pem') }}"
    dest: /opt/heyearth/certs/server-cert.pem
    mode: "0644"

- name: Upload server private key
  copy:
    src: "{{ node_agent_server_key_src | default('/opt/heyearth/mainserver/certs/server-key.pem') }}"
    dest: /opt/heyearth/certs/server-key.pem
    mode: "0600"

- name: Install Shadowsocks per-user service template
  template:
    src: shadowsocks-libev@.service.j2
    dest: /etc/systemd/system/shadowsocks-libev@.service
    mode: "0644"

- name: Install per-user Shadowsocks issuer script
  template:
    src: add-ss-user.sh.j2
    dest: /opt/heyearth/add-ss-user.sh
    mode: "0755"

- name: Install node-agent systemd service
  template:
    src: node-agent.service.j2
    dest: /etc/systemd/system/node-agent.service
    mode: "0644"

- name: Restart node-agent
  systemd:
    name: node-agent
    state: restarted
    enabled: true
    daemon_reload: true
