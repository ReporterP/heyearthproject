---
- name: Install required packages
  apt:
    name:
      - shadowsocks-libev
      - curl
      - jq
      - xxd
      - unzip
    state: present
    update_cache: yes

- name: Allow node-agent gRPC port in UFW
  command: ufw allow {{ node_agent_port | default('50052') }}/tcp
  register: ufw_node_agent_result
  changed_when: "'Rule added' in ufw_node_agent_result.stdout"

- name: Allow Xray Reality port in UFW
  command: ufw allow {{ xray_reality_port | default('443') }}/tcp
  register: ufw_xray_result
  changed_when: "'Rule added' in ufw_xray_result.stdout"

- name: Create runtime directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/heyearth
    - /opt/heyearth/certs
    - /opt/heyearth/state
    - /opt/heyearth/xray
    - /etc/shadowsocks-libev/users

- name: Upload node-agent binary
  copy:
    src: "{{ node_agent_binary_src | default('/opt/heyearth/mainserver/artifacts/node-agent') }}"
    dest: /opt/heyearth/node-agent
    mode: "0755"

- name: Upload CA certificate
  copy:
    src: "{{ node_agent_ca_cert_src | default('/opt/heyearth/mainserver/certs/ca-cert.pem') }}"
    dest: /opt/heyearth/certs/ca-cert.pem
    mode: "0644"

- name: Upload server certificate
  copy:
    src: "{{ node_agent_server_cert_src | default('/opt/heyearth/mainserver/certs/server-cert.pem') }}"
    dest: /opt/heyearth/certs/server-cert.pem
    mode: "0644"

- name: Upload server private key
  copy:
    src: "{{ node_agent_server_key_src | default('/opt/heyearth/mainserver/certs/server-key.pem') }}"
    dest: /opt/heyearth/certs/server-key.pem
    mode: "0600"

# ── Xray-core (VLESS Reality) ─────────────────────────────
- name: Download Xray-core
  get_url:
    url: "https://github.com/XTLS/Xray-core/releases/download/v{{ xray_version | default('25.1.1') }}/Xray-linux-64.zip"
    dest: /tmp/xray.zip
    mode: "0644"
  register: xray_download
  changed_when: xray_download.changed

- name: Extract Xray-core
  unarchive:
    src: /tmp/xray.zip
    dest: /opt/heyearth/xray
    remote_src: yes
    creates: /opt/heyearth/xray/xray

- name: Make Xray executable
  file:
    path: /opt/heyearth/xray/xray
    mode: "0755"

- name: Install Reality key generation script
  template:
    src: generate-reality-keys.sh.j2
    dest: /opt/heyearth/generate-reality-keys.sh
    mode: "0755"

- name: Generate Reality keys (first run only)
  command: /opt/heyearth/generate-reality-keys.sh
  args:
    creates: /opt/heyearth/state/reality-keys.json

- name: Read Reality keys
  slurp:
    src: /opt/heyearth/state/reality-keys.json
  register: reality_keys_raw

- name: Parse Reality keys
  set_fact:
    reality_keys: "{{ reality_keys_raw.content | b64decode | from_json }}"

- name: Install Xray config
  template:
    src: xray-config.json.j2
    dest: /opt/heyearth/xray/config.json
    mode: "0644"
  vars:
    reality_private_key: "{{ reality_keys.privateKey }}"
    reality_short_id: "{{ reality_keys.shortId }}"
  notify: restart xray

- name: Install Xray systemd service
  template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    mode: "0644"

- name: Enable and start Xray
  systemd:
    name: xray
    state: started
    enabled: true
    daemon_reload: true

# ── Shadowsocks ───────────────────────────────────────────
- name: Install Shadowsocks per-user service template
  template:
    src: shadowsocks-libev@.service.j2
    dest: /etc/systemd/system/shadowsocks-libev@.service
    mode: "0644"

- name: Install per-user Shadowsocks issuer script
  template:
    src: add-ss-user.sh.j2
    dest: /opt/heyearth/add-ss-user.sh
    mode: "0755"

# ── Xray user script ─────────────────────────────────────
- name: Install per-user Xray issuer script
  template:
    src: add-xray-user.sh.j2
    dest: /opt/heyearth/add-xray-user.sh
    mode: "0755"

# ── Node Agent ────────────────────────────────────────────
- name: Install node-agent systemd service
  template:
    src: node-agent.service.j2
    dest: /etc/systemd/system/node-agent.service
    mode: "0644"

- name: Restart node-agent
  systemd:
    name: node-agent
    state: restarted
    enabled: true
    daemon_reload: true

