syntax = "proto3";

package heyearth.v1;

option go_package = "github.com/heyearth/backend/internal/pb/heyearth_v1";

// ClientApi — main service for client applications (mobile, desktop, web).
service ClientApi {
  // Auth
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfileResponse);

  // User info
  rpc GetMe(GetMeRequest) returns (UserProfileResponse);
  rpc GetAccessState(GetAccessStateRequest) returns (AccessStateResponse);

  // Connections
  rpc GetConnectionBundle(GetConnectionBundleRequest) returns (ConnectionBundleResponse);

  // Subscriptions & Payments
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc ApplyPromocode(ApplyPromocodeRequest) returns (ApplyPromocodeResponse);

  // App updates
  rpc CheckAppUpdate(CheckAppUpdateRequest) returns (CheckAppUpdateResponse);

  // Health
  rpc Health(HealthRequest) returns (HealthResponse);
}

// ──────────────────── Auth ────────────────────

message RegisterRequest {
  DeviceContext device = 1;
}

message LoginRequest {
  string id_or_username = 1;   // HeYearth ID or username
  string password = 2;         // optional cloud password
  DeviceContext device = 3;
}

message AuthResponse {
  string user_id = 1;          // canonical HeYearth ID
  string token = 2;            // JWT session token
  UserProfileResponse profile = 3;
}

message UpdateProfileRequest {
  string user_id = 1;
  string username = 2;         // set/change username (empty = no change)
  string new_password = 3;     // set/change cloud password (empty = no change)
  string current_password = 4; // required if changing password when one is already set
}

// ──────────────────── Device ────────────────────

message DeviceContext {
  string device_id = 1;
  string platform = 2;
  string device_label = 3;
  string locale = 4;
  string linked_via = 5;
}

// ──────────────────── Health ────────────────────

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// ──────────────────── App Updates ────────────────────

message CheckAppUpdateRequest {
  string platform = 1;
}

message CheckAppUpdateResponse {
  string version = 1;
  string android_url = 2;
  string windows_url = 3;
  string macos_url = 4;
  string linux_url = 5;
  string ios_url = 6;
  string release_notes = 7;
  bool mandatory = 8;
  string min_supported_version = 9;
  repeated string api_endpoints = 10;
}

// ──────────────────── Promocodes ────────────────────

message ApplyPromocodeRequest {
  string user_id = 1;
  string code = 2;
}

message ApplyPromocodeResponse {
  bool success = 1;
  string message = 2;
}

// ──────────────────── User Profile ────────────────────

message GetMeRequest {
  string user_id = 1;
  DeviceContext device = 2;
}

message UserProfileResponse {
  string user_id = 1;
  string username = 2;
  bool has_password = 3;
  string preferred_platform = 4;
  string locale = 5;
  bool is_blocked = 6;
  string current_plan = 7;
  string valid_until = 8;
  string access_status = 9;
  string status_reason = 10;
}

// ──────────────────── Access State ────────────────────

message GetAccessStateRequest {
  string user_id = 1;
  string platform = 2;
}

message AccessStateResponse {
  string user_id = 1;
  string current_plan = 2;
  string valid_until = 3;
  string preferred_platform = 4;
  bool is_blocked = 5;
  bool can_connect = 6;
  string reason = 7;
  bool is_premium = 8;
  bool traffic_masking_available = 9;
}

// ──────────────────── Connections (Hub-and-Spoke) ────────────────────

message GetConnectionBundleRequest {
  string user_id = 1;
  string platform = 2;
  bool force_refresh = 3;
}

message ConnectionOption {
  string uri = 1;                            // connection URI (vless://, socks5://, http://)
  string protocol = 2;                       // "vless", "socks5", "http"
  string label = 3;                          // human-readable label
  repeated string recommended_networks = 4;  // "wifi", "cellular", "ethernet"
  int32 priority = 5;
}

message ConnectionBundleResponse {
  string user_id = 1;
  repeated ConnectionOption connection_options = 2;
  string status_message = 3;
  bool traffic_masking_enabled = 4;
}

// ──────────────────── Subscriptions ────────────────────

message ListSubscriptionsRequest {
  string user_id = 1;
}

message SubscriptionItem {
  int32 group_id = 1;
  string group_name = 2;
  string valid_until = 3;
  bool auto_renew = 4;
  bool active = 5;
  string plan = 6;
  int32 price_rub = 7;
}

message ListSubscriptionsResponse {
  repeated SubscriptionItem items = 1;
}

// ──────────────────── Payments ────────────────────

message ListPaymentsRequest {
  string user_id = 1;
}

message PaymentItem {
  int32 id = 1;
  double amount = 2;
  string currency = 3;
  string status = 4;
  string provider = 5;
  string external_id = 6;
  string notes = 7;
  string created_at = 8;
  string confirmed_at = 9;
}

message ListPaymentsResponse {
  repeated PaymentItem items = 1;
}
