syntax = "proto3";

package node_agent.v1;

option go_package = "github.com/heyearth/backend/internal/pb/node_agent_v1";

service NodeAgent {
  // Create a new VPN user (e.g., Shadowsocks)
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  
  // Delete a VPN user
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // Get current server metrics
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {}
}

message CreateUserRequest {
  string user_id = 1;
  // For multi-hop: vless URI of the next node in the chain.
  // When set, the node's Xray outbound routes traffic to this upstream instead of the internet.
  string upstream_vless_uri = 2;
}

message CreateUserResponse {
  string ss_link = 1;
  string vless_uri = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  double cpu_usage = 1;
  double memory_usage = 2;
  int32 active_connections = 3;

  // Tunnel credentials (из /opt/heyearth/state/reality-keys.json)
  // Позволяют Hub автоматически настроить outbound к exit-ноде
  string tunnel_uuid = 4;         // VLESS UUID
  string tunnel_public_key = 5;   // Reality public key
  string tunnel_short_id = 6;     // Reality short ID
  string tunnel_ss_password = 7;  // Shadowsocks password
}
