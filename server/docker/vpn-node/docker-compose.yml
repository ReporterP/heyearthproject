version: "3.8"

services:
  node-agent:
    build:
      context: ../..
      dockerfile: docker/vpn-node/Dockerfile.node-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=50052
      - TLS_CERT_FILE=/opt/heyearth/certs/server-cert.pem
      - TLS_KEY_FILE=/opt/heyearth/certs/server-key.pem
      - TLS_CA_FILE=/opt/heyearth/certs/ca-cert.pem
      - SS_PUBLIC_HOST=${SS_PUBLIC_HOST}
      - XRAY_REALITY_PORT=${XRAY_REALITY_PORT:-443}
      - XRAY_REALITY_SNI=${XRAY_REALITY_SNI:-microsoft.com}
      - XRAY_REALITY_FINGERPRINT=${XRAY_REALITY_FINGERPRINT:-chrome}
    volumes:
      - certs:/opt/heyearth/certs:ro
      - state:/opt/heyearth/state
      - xray-config:/opt/heyearth/xray
      - ss-config:/etc/shadowsocks-libev/users
    depends_on:
      - xray
      - shadowsocks

  xray:
    build:
      context: ../..
      dockerfile: docker/vpn-node/Dockerfile.xray
    restart: unless-stopped
    network_mode: host
    environment:
      - XRAY_REALITY_PORT=${XRAY_REALITY_PORT:-443}
      - XRAY_REALITY_SNI=${XRAY_REALITY_SNI:-microsoft.com}
    volumes:
      - state:/opt/heyearth/state
      - xray-config:/opt/heyearth/xray

  shadowsocks:
    image: ghcr.io/shadowsocks/ssserver-rust:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ss-config:/etc/shadowsocks-libev/users:ro
    command: ["ssserver", "--log-without-time", "-c", "/etc/shadowsocks-libev/users/config.json"]

volumes:
  certs:
    driver: local
    driver_opts:
      type: none
      device: /opt/heyearth/certs
      o: bind
  state:
    driver: local
    driver_opts:
      type: none
      device: /opt/heyearth/state
      o: bind
  xray-config:
    driver: local
    driver_opts:
      type: none
      device: /opt/heyearth/xray
      o: bind
  ss-config:
    driver: local
    driver_opts:
      type: none
      device: /etc/shadowsocks-libev/users
      o: bind
